<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Shift Log</title>

<meta name="theme-color" content="#F3EFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shift Log">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<style>
:root {
  --bg: #F3EFEA;
  --card: #FFFFFF;
  --ink: #453F49;
  --ink-soft: #948C97;
  --line: #E7E1DA;

  --clinic:  #6D8CA3;
  --lunch:   #87A08A;
  --notes:   #B98298;
  --inbox:   #9689AE;
  --forms:   #BFA476;
  --meeting: #8A7391;

  --radius: 20px;
  --shadow: 0 1px 2px rgba(69, 63, 73, .04), 0 6px 18px rgba(69, 63, 73, .05);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body {
  padding: 0 16px calc(20px + env(safe-area-inset-bottom));
  max-width: 560px;
  margin: 0 auto;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

/* ---------- header ---------- */

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(12px + env(safe-area-inset-top)) 4px 12px;
}
header .titles { flex: 1; min-width: 0; }
h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 650;
  letter-spacing: -0.02em;
}
.today {
  margin-top: 2px;
  font-size: 13px;
  color: var(--ink-soft);
}
.gear {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--card);
  box-shadow: var(--shadow);
  flex: none;
  transition: transform .15s ease;
}
.gear:active { transform: scale(.92); }
.gear svg { width: 20px; height: 20px; display: block; }

/* ---------- active banner ---------- */

.banner {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 18px;
  margin-bottom: 14px;
}
.dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--ink-soft);
  flex: none;
  position: relative;
}
.banner.running .dot { background: var(--accent, var(--clinic)); }
.banner.running .dot::after {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  background: var(--accent, var(--clinic));
  opacity: .3;
  animation: ping 2.4s ease-out infinite;
}
@keyframes ping {
  0%   { transform: scale(.5); opacity: .35; }
  70%  { transform: scale(1.35); opacity: 0; }
  100% { transform: scale(1.35); opacity: 0; }
}
.banner .label { flex: 1; min-width: 0; }
.banner .what {
  font-size: 21px;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--accent, var(--ink));
  margin-top: 1px;
}
.banner .since {
  font-size: 11px;
  color: var(--ink-soft);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
}

/* ---------- task grid ---------- */

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}
.tile {
  position: relative;
  border-radius: var(--radius);
  background: var(--c);
  color: #fff;
  min-height: 140px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
  opacity: .78;
  box-shadow: var(--shadow);
  transition: transform .12s ease, filter .12s ease;
  overflow: hidden;
}
.tile:active { transform: scale(.97); filter: brightness(.95); }
.tile .name {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.015em;
}
/* The selected tile is the one thing that must read at a glance. */
.tile.active { opacity: 1; }
.tile .state {
  font-size: 12px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: .1em;
  margin-top: 6px;
  opacity: 0;
}
.tile.active .state { opacity: .95; }
/* "breathing" inset ring on the running tile */
.tile.active::after {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: 15px;
  border: 2px solid rgba(255, 255, 255, .85);
  animation: breathe 2.8s ease-in-out infinite;
  pointer-events: none;
}
@keyframes breathe {
  0%, 100% { opacity: .25; transform: scale(.985); }
  50%      { opacity: .9;  transform: scale(1); }
}

/* ---------- cards ---------- */

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
}
.card h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.card .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

.endday {
  display: block;
  width: 100%;
  padding: 15px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow);
  color: var(--ink);
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.01em;
  text-align: center;
  margin-bottom: 16px;
  transition: transform .12s ease, opacity .12s ease;
}
.endday:active { transform: scale(.98); }
.endday[disabled] { opacity: .45; }

/* Shown when the app cannot be trusted to know the current task. */
#weekProblem { display: none; }
#weekProblem.show { display: block; }
.problem-text { font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
#weekProblem .btn { margin-top: 14px; }

/* ---------- settings sheet ---------- */

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(69, 63, 73, .32);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
  z-index: 40;
  backdrop-filter: blur(2px);
}
.scrim.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 50;
  background: var(--bg);
  border-radius: 26px 26px 0 0;
  padding: 10px 20px calc(28px + env(safe-area-inset-bottom));
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateY(101%);
  transition: transform .3s cubic-bezier(.32, .72, 0, 1);
  box-shadow: 0 -8px 40px rgba(69, 63, 73, .14);
}
.sheet.open { transform: translateY(0); }
.handle {
  width: 40px; height: 4px;
  border-radius: 99px;
  background: #DAD3CB;
  margin: 4px auto 16px;
}
.sheet h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.02em; }
.sheet .hint { font-size: 13px; color: var(--ink-soft); line-height: 1.45; margin: 0 0 16px; }
.sheet h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-soft);
  margin: 24px 0 10px;
  font-weight: 600;
}
input[type=url], input[type=text] {
  width: 100%;
  padding: 13px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 16px;
  color: var(--ink);
  outline: none;
}
input:focus { border-color: var(--clinic); }
.btn {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 14px;
  border-radius: 14px;
  background: var(--clinic);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  transition: transform .12s ease;
}
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--card); color: var(--ink-soft); box-shadow: var(--shadow); }

.link {
  background: var(--card);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
}
.link .meta { flex: 1; min-width: 0; }
.link .lname {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 7px;
}
.link .lname i {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--c, var(--ink-soft));
  display: inline-block;
  flex: none;
}
.link .lurl {
  font-size: 11px;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 3px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.copy {
  flex: none;
  padding: 8px 13px;
  border-radius: 10px;
  background: var(--bg);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  transition: background .15s ease, color .15s ease;
}
.copy.done { background: var(--lunch); color: #fff; }

#linksEmpty { font-size: 13px; color: var(--ink-soft); }

/* ---------- toast ---------- */

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--ink);
  color: #fff;
  font-size: 13px;
  padding: 11px 18px;
  border-radius: 99px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 90;
  max-width: 88vw;
  text-align: center;
}
#toast.show { opacity: .96; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header>
  <div class="titles">
    <h1>Shift Log</h1>
    <div class="today" id="today"></div>
  </div>
  <button class="gear" id="gearBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="#948C97" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</header>

<div class="banner" id="banner">
  <div class="dot"></div>
  <div class="label">
    <div class="since">Current task</div>
    <div class="what" id="bannerWhat">None</div>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="card" id="weekProblem">
  <div class="problem-text" id="weekProblemText"></div>
  <button class="btn" id="weekProblemBtn">Open settings</button>
</div>

<button class="endday" id="endDayBtn">End day</button>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2>Settings</h2>
  <p class="hint">
    Paste the Google Apps Script Web App URL (the one ending in
    <b>/exec</b>). Everything syncs to that sheet.
  </p>
  <input type="url" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec"
         autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url">
  <button class="btn" id="saveUrl">Save</button>

  <h3>NFC tag links</h3>
  <div id="linksEmpty">Save your Web App URL to generate tag links.</div>
  <div id="linksList"></div>

  <button class="btn ghost" id="closeSheet" style="margin-top:24px">Done</button>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var TASKS = [
    { id: 'clinic',  name: 'Clinic',  color: '#6D8CA3' },
    { id: 'lunch',   name: 'Lunch',   color: '#87A08A' },
    { id: 'notes',   name: 'Notes',   color: '#B98298' },
    { id: 'inbox',   name: 'Inbox',   color: '#9689AE' },
    { id: 'forms',   name: 'Forms',   color: '#BFA476' },
    { id: 'meeting', name: 'Meeting', color: '#8A7391' }
  ];
  var BY_ID = {};
  TASKS.forEach(function (t) { BY_ID[t.id] = t; });

  var LS_URL = 'shiftlog.url';
  var LS_QUEUE = 'shiftlog.queue';
  var REFRESH_MS = 60000;
  var RETRY_MS = 20000;

  var $ = function (id) { return document.getElementById(id); };

  var scriptUrl = localStorage.getItem(LS_URL) || '';
  var state = { active: null };
  var inFlight = 0;
  var loadedOnce = false;      // has a summary ever arrived from the server?
  var lastError = null;

  /* ---------- formatting ---------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* ---------- rendering ---------- */

  function buildGrid() {
    var grid = $('grid');
    TASKS.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'tile';
      b.style.setProperty('--c', t.color);
      b.dataset.task = t.id;
      b.innerHTML = '<div class="name"></div><div class="state">Current</div>';
      b.querySelector('.name').textContent = t.name;
      b.addEventListener('click', function () { onTileTap(t.id); });
      grid.appendChild(b);
    });
  }

  // Says only which task is current — no clock. A timer that can drift or go
  // stale invites corrections that log the wrong thing.
  function renderBanner() {
    var banner = $('banner');
    if (!state.active) {
      banner.classList.remove('running');
      banner.style.removeProperty('--accent');
      $('bannerWhat').textContent =
        !scriptUrl ? 'Not connected' : (loadedOnce ? 'None' : '…');
      return;
    }
    var t = BY_ID[state.active.task];
    banner.classList.add('running');
    banner.style.setProperty('--accent', t ? t.color : '#6D8CA3');
    $('bannerWhat').textContent = t ? t.name : state.active.task;
  }

  function renderTiles() {
    var activeId = state.active ? state.active.task : null;
    Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (tile) {
      var isActive = tile.dataset.task === activeId;
      tile.classList.toggle('active', isActive);

    });
  }

  function renderAll() {
    renderBanner();
    renderTiles();
    renderConnection();
  }

  /* ---------- server sync ---------- */

  function apply(data) {
    if (!data || data.status !== 'ok') return false;
    state.active = data.active || null;
    renderAll();
    return true;
  }

  function buildUrl(params) {
    var qs = Object.keys(params).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return scriptUrl + (scriptUrl.indexOf('?') === -1 ? '?' : '&') + qs;
  }

  // Everything goes over GET: Apps Script does not answer CORS preflights.
  function call(params) {
    if (!scriptUrl) return Promise.reject(new Error('no-url'));
    inFlight++;
    return fetch(buildUrl(params), { method: 'GET', redirect: 'follow' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (data && data.status === 'error') throw new Error(data.message || 'error');
        return data;
      })
      .finally(function () { inFlight--; });
  }

  function refresh() {
    if (!scriptUrl) { renderConnection(); return Promise.resolve(); }
    return call({ summary: 1 })
      .then(function (data) {
        // Flags first: apply() renders, and the banner reads them.
        loadedOnce = true;
        lastError = null;
        apply(data);
      })
      .catch(function (err) {
        // Zeros drawn as if they were real is the worst outcome; say so instead.
        lastError = String(err && err.message ? err.message : err);
        renderConnection();
      });
  }

  /**
   * The weekly card must never show an empty chart that looks like a genuine
   * zero week. If there is no URL, or nothing has ever loaded, explain instead.
   */
  function renderConnection() {
    var problem = null;
    if (!scriptUrl) {
      problem = 'Not connected to your sheet yet. Add the Google Apps Script ' +
                'Web App URL to start logging.';
    } else if (!loadedOnce) {
      problem = lastError
        ? 'Could not reach your sheet, so the current task shown above may be ' +
          'out of date. Check the URL in settings — retrying automatically.'
        : 'Checking what is running…';
    }

    $('endDayBtn').disabled = !scriptUrl || !loadedOnce || !state.active;
    $('weekProblem').classList.toggle('show', problem !== null);
    $('weekProblemBtn').style.display =
        (problem && (!scriptUrl || lastError)) ? 'block' : 'none';
    if (problem) $('weekProblemText').textContent = problem;
  }

  /* ---------- offline queue ---------- */

  function readQueue() {
    try { return JSON.parse(localStorage.getItem(LS_QUEUE)) || []; }
    catch (e) { return []; }
  }

  function writeQueue(q) {
    localStorage.setItem(LS_QUEUE, JSON.stringify(q));
  }

  function enqueue(params) {
    var q = readQueue();
    q.push({ params: params, at: Date.now() });
    writeQueue(q);
    toast('Offline — saved, will sync');
  }

  // Drain oldest-first, stopping at the first failure so order is preserved.
  function flushQueue() {
    var q = readQueue();
    if (!q.length || !scriptUrl) return Promise.resolve(false);

    var item = q[0];
    return call(item.params).then(function (data) {
      writeQueue(readQueue().slice(1));
      apply(data);
      return flushQueue().then(function () { return true; });
    }).catch(function () {
      return false;
    });
  }

  /* ---------- actions ---------- */

  function onTileTap(taskId) {
    if (!scriptUrl) {
      openSheet();
      toast('Add your Web App URL first');
      return;
    }
    // Always a start. Tapping the current task re-asserts it rather than
    // stopping, so a tap made because the display looked wrong cannot silently
    // end the day. Stopping is the End day button's job alone.
    var params = { task: taskId, action: 'start', source: 'button' };

    // Optimistic: flip the UI now, reconcile with the server's answer after.
    state.active = { task: taskId, startTime: new Date().toISOString() };
    renderAll();

    call(params)
      .then(apply)
      .catch(function (err) {
        if (String(err.message) === 'no-url') return;
        enqueue(params);
      });
  }

  function endDay() {
    if (!scriptUrl) { openSheet(); toast('Add your Web App URL first'); return; }
    if (!state.active) { toast('Nothing is running'); return; }

    var params = { action: 'stop', source: 'end-day' };
    state.active = null;
    renderAll();

    call(params)
      .then(apply)
      .catch(function (err) {
        if (String(err.message) === 'no-url') return;
        enqueue(params);
      });
  }

  /* ---------- settings sheet ---------- */

  function openSheet() {
    $('urlInput').value = scriptUrl;
    $('sheet').classList.add('open');
    $('scrim').classList.add('open');
  }

  function closeSheet() {
    $('sheet').classList.remove('open');
    $('scrim').classList.remove('open');
  }

  function linkRows() {
    var rows = TASKS.map(function (t) {
      return {
        name: t.name,
        color: t.color,
        url: scriptUrl + '?action=start&task=' + t.id + '&source=nfc'
      };
    });
    rows.push({
      name: 'Stop (location)',
      color: '#948C97',
      url: scriptUrl + '?action=stop&source=location'
    });
    return rows;
  }

  function renderLinks() {
    var list = $('linksList');
    list.innerHTML = '';
    $('linksEmpty').style.display = scriptUrl ? 'none' : 'block';
    if (!scriptUrl) return;

    linkRows().forEach(function (row) {
      var el = document.createElement('div');
      el.className = 'link';
      el.style.setProperty('--c', row.color);
      el.innerHTML =
        '<div class="meta"><div class="lname"><i></i><span></span></div>' +
        '<div class="lurl"></div></div>' +
        '<button class="copy">Copy</button>';
      el.querySelector('.lname span').textContent = row.name;
      el.querySelector('.lurl').textContent = row.url;

      var btn = el.querySelector('.copy');
      btn.addEventListener('click', function () {
        copyText(row.url).then(function () {
          btn.textContent = 'Copied';
          btn.classList.add('done');
          setTimeout(function () {
            btn.textContent = 'Copy';
            btn.classList.remove('done');
          }, 1600);
        }).catch(function () { toast('Could not copy — long-press the link text'); });
      });
      list.appendChild(el);
    });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    // Fallback for older iOS Safari.
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }

  function saveUrl() {
    var value = $('urlInput').value.trim().replace(/[?&].*$/, '');
    if (value && !/^https:\/\//.test(value)) {
      toast('URL must start with https://');
      return;
    }
    scriptUrl = value;
    localStorage.setItem(LS_URL, scriptUrl);
    renderLinks();
    lastError = null;
    loadedOnce = false;
    renderConnection();
    if (scriptUrl) {
      toast('Saved — syncing…');
      refresh().then(function () { flushQueue(); });
    } else {
      toast('URL cleared');
    }
  }

  /* ---------- boot ---------- */

  function init() {
    $('today').textContent = new Date().toLocaleDateString([], {
      weekday: 'long', month: 'long', day: 'numeric'
    });

    buildGrid();
    renderAll();
    renderLinks();

    $('gearBtn').addEventListener('click', openSheet);
    $('weekProblemBtn').addEventListener('click', openSheet);
    $('endDayBtn').addEventListener('click', endDay);
    $('scrim').addEventListener('click', closeSheet);
    $('closeSheet').addEventListener('click', closeSheet);
    $('saveUrl').addEventListener('click', saveUrl);

    setInterval(function () { if (inFlight === 0) refresh(); }, REFRESH_MS);
    setInterval(flushQueue, RETRY_MS);
    window.addEventListener('online', function () {
      flushQueue().then(refresh);
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { flushQueue(); refresh(); }
    });

    // Never open Settings unasked. Without a URL the banner says so and the
    // gear is one tap away; refresh() is a no-op until one is saved.
    refresh().then(flushQueue);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
